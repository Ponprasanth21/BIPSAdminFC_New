<style>
body {
	background-color: lightgrey;
}
.dataTables_empty{

    color: #be3232;


}
.h2, h2 {
	font-size: 2rem;
	background-color: #555;
	color: white;
}



.pagebut {
	margin-top: 1%;
	/*  width: 58%;  */
	padding: 1% 1%;
	background-color: #2e455d;
	color: white;
}

.menu-title-header {
	padding: 0.45rem 0.45rem;

	text-align: center;

<script th:inline="javascript">
	/*<![CDATA[*/

	var id = /*[[${id}]]*/0;
	
	var loginUser=/*[[${loginUser}]]*/;
	
	function home() {
		location.href = 'admin'
	}

	function back() {
		window.history.back();
	}

	function alertCloseDialog() {
		window.history.go(-2);
	}

	function submitform(a) {
		$("#loader1").modal("toggle");
		var audit = a.getAttribute("data-audit");
		var type = a.getAttribute("data-type");
		var seqUniqueID = "";
		var currency = a.getAttribute("data-currency");
		var amount = a.getAttribute("data-amount");
		var acctNumber = a.getAttribute("data-acctNumber");
		var loginUser = a.getAttribute("data-loginUser");
		var typeMode = "";
		if (type == ("DEBIT_REVERSE")) {
			typeMode = "0";
			seqUniqueID = a.getAttribute("data-seqUniqueID");

		} else if (type == ("CREDIT_REVERSE")) {
			typeMode = "1";
			seqUniqueID = a.getAttribute("data-seqUniqueID");

		} else if (type == ("BULK_CREDIT_REVERSE")) {
			typeMode = "2";
			seqUniqueID = id;
		}else if (type == ("BULK_DEBIT_REVERSE")) {
			typeMode = "3";
			seqUniqueID = a.getAttribute("data-seqUniqueID");

		}

		//alert(loginUser);
		var myKeyVals = {
			"sequence_unique_id" : seqUniqueID,
			"tran_audit_number" : audit,
			"tran_type" : type,
			"tran_currency" : currency,
			"tran_amount" : amount,
			"bob_account" : acctNumber
		};
		var settings = {

			"url" : "/IPSAdmin/ReversalTransaction?userID="+loginUser,
			"method" : "POST",
			"headers" : {
				"content-type" : "application/json",
				"cache-control" : "no-cache",
			},
			"processData" : false,
			"data" : JSON.stringify(myKeyVals)
		};
		//$('body').loadingIndicator();

		$.ajax(settings).done(function(response) {
			$("#loader1").modal("hide");
			$("#alertmsg").text(response);
			var modal = document.getElementById("alert");
			modal.style.display = "block";

		});

	}
	/*<![CDATA[*/
</script>
<body>

	<div th:insert="MMenupage :: header"></div>
	<div class="container-manager">
		<div class="card">
			<div class="card-header" style="background-color: #2e455d;">
				<div class="float-left">
					<h6 style="color: white;">Reversal Transaction</h6>
				</div>
			</div>

			<div class="row">
				<div class="col-sm-12">
					<div
						style="overflow-y: auto; overflow-x: auto; background: lightgrey">

						<table class="table table-striped table-bordered table-hover "
							id="usertable">
							<thead class="thead-light">

								<tr>
									<th>IPS Ref ID</th>
									<th>CBS Audit Number</th>
									<th>Tran Date</th>
									<th>Account Number</th>
									<th>Currency</th>
									<th>Tran Amount</th>
									<th>Type</th>
									<th>Status</th>
									<th>Reason</th>
								</tr>
							</thead>
							<tbody>

								<tr style="font-size: smaller">

									<td th:text="${tranMonitorCBS.sequence_unique_id}"></td>

									<td th:text="${tranMonitorCBS.tran_audit_number}"></td>
									<td
										th:text="${#dates.format(tranMonitorCBS.tran_date,'dd-MM-yyyy')}"></td>
									<td th:text="${tranMonitorCBS.bob_account}"></td>
									<td th:text="${tranMonitorCBS.tran_currency}"></td>
									<td
										th:text="${#numbers.formatDecimal(tranMonitorCBS.tran_amount, 0, 'COMMA', 2, 'POINT')}"
										style="text-align: right;"></td>
									<td th:text="${tranMonitorCBS.tran_type}"></td>
									<td th:text="${tranMonitorCBS.tran_cbs_status}"></td>
									<td th:text="${tranMonitorCBS.tran_cbs_status_error}"></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>

			<div class="card-footer text-center" style="background: #2e455d">

				<button type="button" class="btn btn-sm btn-primary" id="btnHome"
					onclick="home();">Home</button>
				<button type="button" class="btn btn-sm btn-primary"
					th:attr="data-audit=${tranMonitorCBS.tran_audit_number},data-type=${tranMonitorCBS.tran_type}
					,data-seqUniqueID=${tranMonitorCBS.sequence_unique_id},data-currency=${tranMonitorCBS.tran_currency}
					,data-amount=${tranMonitorCBS.tran_amount},data-acctNumber=${tranMonitorCBS.bob_account},
					data-loginUser=${session.USERID}"
					id="btnSubmit" onclick="submitform(this);">Submit</button>
				<button type="button" class="btn btn-sm btn-primary" id="btnBack"
					onclick="back();">Back</button>


			</div>
		</div>

		<!--------------------------------------------------------------- Modal for alert messages-------------------------------->
		<div class="modal" id="alert">
			<div
				class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
				<div class="modal-content" >
				<div class="menu-title-header">
					<div class="modal-title" id="exampleModalLabel"
						style="text-align: center; color: white;">BANK OF BARODA</div>
				</div>
					<div class="modal-body" style="text-align: center;background-color: #c6ccd2">
						<p id="alertmsg" style="font-size: 20px;"></p>
						<button type="button" class="btn btn-primary" data-dismiss="modal"
							onclick="alertCloseDialog();">Close</button>
					</div>
				</div>
			</div>
		</div>
		<!-- -------------------------------------------------------------------------------------- -->
	</div>
	
	<div class="modal fade" id="loader1" data-backdrop="static"
		data-keyboard="false">
		<div
			class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
			<div class="modal-content" style="background: transparent;">
				<div class="modal-body" style="text-align: center">
					<div>
						<img th:src=@{/images/loader.gif} id="bfirelogo"
							style="width: 153px; margin-left: 18px;" alt="Bornfire">
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
