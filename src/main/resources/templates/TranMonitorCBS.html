<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org" th:fragment="summary">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css"
	href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"
	th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
<link rel="stylesheet" type="text/css"
	href="/webjars/font-awesome/5.9.0/css/all.min.css"
	th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
<link rel="stylesheet" type="text/css"
	href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css"
	th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
<link rel="stylesheet" type="text/css"
	href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css"
	th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">
<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
	th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
<script src="/webjars/popper.js/1.14.7/umd/popper.min.js"
	th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
<script src="/webjars/jquery/3.4.1/jquery.min.js"
	th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js"
	th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>

<script src="/webjars/jquery-form/4.2.2/jquery.form.min.js"
	th:src="@{/webjars/jquery-form/4.2.2/jquery.form.min.js}"></script>

<script src="/webjars/jquery-validation/1.19.0/jquery.validate.min.js"
	th:src="@{/webjars/jquery-validation/1.19.0/jquery.validate.min.js}"></script>

<script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js"
	th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
<script
	src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js"
	th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>


<script src="js/bootstrap411.js"></script>
<link rel="stylesheet" href="css/spur.css">

<style>
body {
	background-color: lightgrey;
}

.h2, h2 {
	font-size: 2rem;
	background-color: #555;
	color: white;
}

.dataTables_empty {
	color: #be3232;
}

.pagebut {
	margin-top: 1%;
	/*  width: 58%;  */
	padding: 1% 1%;
	background-color: #2e455d;
	color: white;
}

select {
	width: 150px;
	margin: 10px;
}

td {
	background-color: #f8f7ff;
}

select:focus {
	min-width: 150px;
	width: auto;
}

#hidden_div {
	display: none;
}

table th {
	color: white;
	background-color: #2e455deb;
	font-size: small;
}

table td {
	font-size: small;
}


#overlay {
	position: fixed;
	top: 0;
	z-index: 100;
	width: 100%;
	height: 100%;
	display: none;
	background: rgba(0, 0, 0, 0.6);
}

.cv-spinner {
	height: 100%;
	display: flex;
	justify-content: center;
	align-items: center;
}

.spinner {
	/* width: 40px;
	height: 40px;
	border: 4px #00343d solid;
	border-top: 4px #181818 solid;
	border-radius: 50%;
	animation: sp-anime 0.8s infinite linear; */
	
}

@
keyframes sp-anime { 100% {
	transform: rotate(360deg);
}

}
/* Chrome, Safari, Edge, Opera */
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
	-webkit-appearance: none;
	margin: 0;
}
</style>
</head>

<script>

jQuery(function($){
	$(document).ajaxSend(function() {
		$("#overlay").fadeIn(300);　
	});
		
	$('.btn').click(function(){
		$.ajax({
			type: 'POST',
			success: function(data){
				console.log(data);
			}
		}).done(function() {
			setTimeout(function(){
				$("#overlay").fadeOut(300);
			},500);
		});
	});	
});


</script>
<script th:inline="javascript">
	/*<![CDATA[*/
	function home() {
		location.href = '/IPSAdmin/IPSDashboard'
	}

	function back() {
		window.history.back();
	}
	/*<![CDATA[*/
</script>
<body>

	<div th:insert="MMenupage :: header"></div>
	<div class="container-manager">
		<div id="overlay">
			<div class="cv-spinner">
				<span class="spinner"></span>
			</div>
		</div>
		<div class="card">
			<div class="card-header">
				<div class="float-left">
					<h6 style="color: white;">Transaction Monitoring-CBS</h6>
				</div>
			</div>

			<div class="row">
				<div class="col-sm-12">
					<div
						style="overflow-y: auto; overflow-x: auto; background: lightgrey">

						<table class="table table-striped table-bordered table-hover "
							id="usertable">
							<thead class="thead-light">

								<tr>
									<th>IPS Ref ID</th>
									<th>CBS Audit Number</th>
									<th>Tran Date</th>
									<th>Account Number</th>
									<th>Currency</th>
									<th>Tran Amount</th>
									<th>Type</th>
									<th>Reason</th>
									<th>Status</th>
									<th>Created By</th>
								</tr>
							</thead>
							<tbody>

								<tr style="font-size: smaller"
									th:each="tranMonitorCBS : ${tranMonitorCBS}"
									onclick="fnClick(this);" class="userlist">

									<td th:text="${tranMonitorCBS.sequence_unique_id}"></td>


									<th:block
										th:switch="${tranMonitorCBS.tran_type}+'/'+${type}+'/'+${tranMonitorCBS.tran_cbs_status}+'/'+${typeMode}">
										<td th:case="'DEBIT_REVERSE/0/FAILURE/S'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'BULK_CREDIT_REVERSE/0/FAILURE/S'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'BULK_DEBIT_REVERSE/0/FAILURE/S'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'CREDIT_REVERSE/0/FAILURE/S'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'DEBIT_REVERSE/0/FAILURE/A'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}+'?id='+${id}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'CREDIT_REVERSE/1/FAILURE/A'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}+'?id='+${id}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'DEBIT_REVERSE/2/FAILURE/A'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}+'?id='+${id}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'BULK_CREDIT_REVERSE/3/FAILURE/A'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}+'?id='+${id}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="'BULK_DEBIT_REVERSE/4/FAILURE/A'"><a
											th:href="@{'/ReverseTran/'+${tranMonitorCBS.tran_audit_number}+'?id='+${id}}"
											th:text="${tranMonitorCBS.tran_audit_number}"></a></td>
										<td th:case="*" th:text="${tranMonitorCBS.tran_audit_number}"></td>

									</th:block>

									<td
										th:text="${#dates.format(tranMonitorCBS.tran_date,'dd-MM-yyyy')}"></td>
									<td th:text="${tranMonitorCBS.bob_account}"></td>
									<td th:text="${tranMonitorCBS.tran_currency}"></td>
									<td
										th:text="${#numbers.formatDecimal(tranMonitorCBS.tran_amount, 0, 'COMMA', 2, 'POINT')}"
										style="text-align: right;"></td>
									<td th:text="${tranMonitorCBS.tran_type}"></td>
									<td th:text="${tranMonitorCBS.tran_cbs_status_error}"></td>
									<td th:text="${tranMonitorCBS.tran_cbs_status}"></td>
									<td th:text="${tranMonitorCBS.entry_user}"></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>

			<div class="card-footer text-center">

				<button type="button" class="btn btn-sm btn-primary" id="btnHome"
					onclick="home();">Home</button>

				<button type="button" class="btn btn-sm btn-primary" id="btnBack"
					onclick="back();">Back</button>
			</div>
		</div>
	</div>
</body>
</html>
