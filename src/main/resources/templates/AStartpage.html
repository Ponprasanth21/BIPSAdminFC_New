	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"

	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">



	<title>IPSAdmin</title>


	<style type="text/css">
		html,
		body {
			width: 100%;
			min-height: 100%;
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
		}

		body {
			min-height: 100vh;
		}

		/* Main page: preserve your existing background image */
		.login-page {
			min-height: 100vh;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 40px 4%;
			box-sizing: border-box;
			background-repeat: no-repeat;
			background-position: center center;
			background-size: cover;
		}

		/* LEFT BRANDING */
		.branding-section {
			width: 58%;
			max-width: 800px;
			padding-left: 1%;
			box-sizing: border-box;
			margin-bottom: 135px;
			/* Left branding moves up */
		}

		.branding-header {
			display: flex;
			align-items: center;
			gap: 24px;
		}

		.bornfire-logo {
			width: 100px;
			height: 115px;
			flex-shrink: 0;
			object-fit: contain;
		}

		.branding-section {
			width: 65%;
			max-width: 1000px;
			padding-left: 1%;
			box-sizing: border-box;
			margin-bottom: 135px;
		}

		.branding-title {
		    display: block;
		    margin: 0 0 10px;
		    font-size: clamp(26px, 4vw, 45px);
		    font-weight: 800;
		    line-height: 1.12;
		    white-space: nowrap;

		    background: linear-gradient(
		        to right,
		        #8bd5ff 0%,
		        #1688d5 40%,
		        #123b7b 100%
		    );

		    -webkit-background-clip: text;
		    background-clip: text;
		    -webkit-text-fill-color: transparent;
		    color: transparent;
		}

		/* Align the title with the bottom of the logo */
		.branding-header {
			display: flex;
			align-items: flex-end;
			gap: 25px;
		}

		.branding-title span {
			display: inline;
			white-space: nowrap;
		}

		.branding-divider {
			width: 96%;
			height: 3px;
			margin-top: 2px;
			background: #e9b52e;
		}

		.branding-subtitle {
			margin-top: 16px;
			margin-bottom: 12px;
			color: #173d75;
			font-size: 25px;
			letter-spacing: 5px;
			text-align: right;
			margin-right: 58px;
		}

		.branding-tagline {
			width: 100%;
			text-align: right;
			color: #173d75;
			font-size: 18px;
			font-weight: 700;
			letter-spacing: 2px;
			width: calc(100% - 45px);
			margin-left: 0;
			margin-right: 45px;
			text-align: right;
			box-sizing: border-box;
		}

		.branding-tagline span {
			color: #e9b52e;
			padding: 0 5px;
		}

		.branding-features {
			display: flex;
			align-items: center;
			margin-top: 100px;
			max-width: 700px;
		}

		.feature-item {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
			text-align: center;
			color: #ffffff;
			font-size: 13px;
			line-height: 1.4;
			border-right: 1px solid rgba(255, 255, 255, 0.55);
		}

		.feature-item:last-child {
			border-right: none;
		}

		.feature-item i {
			font-size: 30px;
		}

		/* RIGHT LOGIN AREA */
		.login-section {
			width: 30%;
			display: flex;
			justify-content: center;
			align-items: center;
			margin-top: 250px;
			/* Right login moves down */
		}

		.card-container.card {
			width: 100%;
			max-width: 510px;
			padding: 32px 36px;
			box-sizing: border-box;
		}

		.card {
			background: #ffffff !important;
			border: none !important;
			border-radius: 24px !important;
			margin: 0 !important;
			display: block !important;
			box-shadow: 0 8px 30px rgba(0, 40, 90, 0.18) !important;
		}

		/* First Capital Bank logo */
		.bank-logo {
			display: block;
			width: 200px;
			max-width: 100%;
			height: 60px;
			object-fit: contain;
			margin: 0 auto 16px;
			border-radius: 0 !important;
		}

		/* Login heading */
		.login-title {
			color: #10245c;
			font-size: 28px;
			font-weight: 700;
			text-align: center;
			margin: 8px 0;
		}

		.login-subtitle {
			color: #596477;
			text-align: center;
			font-size: 14px;
			margin: 8px 0 18px;
		}

		.login-divider {
			width: 130px;
			height: 3px;
			margin: 0 auto 24px;
			background: #e9b52e;
		}

		/* Username and password */
		.input-wrapper {
			position: relative;
			margin-bottom: 14px;
		}

		.input-wrapper i {
			position: absolute;
			left: 18px;
			top: 50%;
			transform: translateY(-50%);
			color: #536078;
			font-size: 18px;
			z-index: 2;
		}

		.form-signin .form-control {
			width: 100%;
			height: 60px;
			padding: 12px 18px 12px 55px;
			box-sizing: border-box;
			border: 1px solid #dce2eb;
			border-radius: 12px;
			background: #f5f8fc;
			font-size: 16px;
		}

		.form-signin .form-control:focus {
			border-color: #0878df;
			outline: none;
			box-shadow: 0 0 0 3px rgba(8, 120, 223, 0.12);
		}

		/* Login button */
		.btn.btn-signin {
			width: 100%;
			height: 58px;
			margin-top: 6px;
			padding: 0 15px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(90deg, #0878df, #0755b8);
			color: #ffffff;
			font-size: 18px;
			font-weight: 700;
			cursor: pointer;
			transition: background 0.2s ease;
		}

		.btn.btn-signin:hover,
		.btn.btn-signin:focus {
			background: #064a9f;
			color: #ffffff;
		}

		.btn.btn-signin span {
			margin-left: 6px;
		}

		.login-message {
			text-align: center;
			margin-bottom: 10px;
			font-size: 13px;
		}

		.error-message {
			color: #cd103c;
		}

		.success-message {
			color: #279a36;
		}

		/* Responsive layout */
		@media (max-width: 900px) {
			.login-page {
				flex-direction: column;
				justify-content: center;
				gap: 35px;
				padding: 30px 20px;
			}

			.branding-section,
			.login-section {
				width: 100%;
				max-width: 600px;
			}

			.branding-header {
				gap: 15px;
			}

			.bornfire-logo {
				width: 70px;
				height: 85px;
			}

			.branding-title {
				font-size: clamp(26px, 4vw, 45px);
			}

			.branding-features {
				margin-top: 35px;
			}

			.login-section {
				max-width: 510px;
			}
		}

		@media (max-width: 480px) {
			.card-container.card {
				padding: 25px 20px;
			}

			.branding-subtitle {
				font-size: 18px;
				letter-spacing: 3px;
			}

			.branding-tagline {
				font-size: 10px;
				letter-spacing: 1px;
			}

			.branding-features {
				margin-top: 25px;
			}

			.feature-item {
				font-size: 11px;
			}
		}
	</style>

</head>

<body>

	<!-- header & menu -->
	<div th:insert="AStartheader :: header"></div>

	<!-- Frame -->



	<div class="login-page">

		<!-- LEFT SIDE: BORNFire BRANDING -->
		<div class="branding-section">

			<div class="branding-header">

				<img th:src="@{/images/Bornfire.png}" class="bornfire-logo" alt="Bornfire Logo">

				<h1 class="branding-title">Bornfire Instant Payment System
				</h1>

			</div>

			<div class="branding-divider"></div>

			<p class="branding-subtitle"></p>

			<p class="branding-tagline">
				FAST <span>•</span> SECURE <span>•</span>
				RELIABLE <span>•</span> CONNECTING MAURITIUS
			</p>

			<div class="branding-features">

			</div>

		</div>

		<!-- RIGHT SIDE: LOGIN CARD -->
		<div class="login-section">

			<div class="card card-container">

				<img th:src="@{/images/First_Capital_Bank.jpeg}" class="bank-logo" alt="First Capital Bank">

				<h2 class="login-title">IPSAdmin Login</h2>

				<p class="login-subtitle">
					Bornfire Instant Payment System - Admin Portal
				</p>

				<div class="login-divider"></div>

				<form th:action="@{/login}" method="post" name="Login_Form" class="form-signin">

					<div class="input-wrapper">
						<i class="fas fa-user"></i>
						<input type="text" class="form-control" name="userid" id="userid" placeholder="Username"
							onkeyup="this.value = this.value.toUpperCase();" required autofocus>
					</div>

					<div class="input-wrapper">
						<i class="fas fa-lock"></i>
						<input type="password" class="form-control" name="password" id="password" placeholder="Password"
							required>
					</div>

					<div class="login-message">
						<span th:if="${param.error}" th:text="${param.error}" class="error-message"></span>

						<span th:if="${param.logout}" class="success-message">
							You have been logged out.
						</span>
					</div>

					<button class="btn btn-signin" type="submit">
						Login <span>&rarr;</span>
					</button>

				</form>

			</div>

		</div>

	</div>
